name: Build release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to upload binaries to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            extension: .exe
          - os: macos-latest
            target: macos
            extension: ''
          - os: ubuntu-22.04
            target: linux
            extension: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install . pyinstaller
      - name: Build executable
        run: python -m PyInstaller --onefile --console --name PyPass-${{ matrix.target }} main.py
      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag_name }}
          files: dist/PyPass-${{ matrix.target }}${{ matrix.extension }}
          fail_on_unmatched_files: true

  source-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name }}
      - name: Create source zip
        run: git archive --format=zip --prefix=PyPass-1.1.0/ -o PyPass-source.zip HEAD
      - name: Upload source zip
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag_name }}
          files: PyPass-source.zip
          fail_on_unmatched_files: true
